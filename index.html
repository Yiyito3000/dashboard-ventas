<script>
// ─── CONFIG ──────────────────────────────────────────────────────────────────
const SHEET_ID = '1aDhgUb2_ftx0bGcjAg9qngy2eTNQYr-37y2WN42GBZs';
const TIENDAS_PROPIAS = ['Sportway', 'Molten', 'Macron', 'Mitre', 'Reusch'];
const MARKETPLACES    = ['Falabella', 'Paris', 'Ripley', 'Meli', 'Walmart', 'Hites'];

// Colors per site
const SITE_COLORS = {
  Sportway:  { color: '#185FA5', bg: '#E6F1FB', bar: '#378ADD' },
  Macron:    { color: '#534AB7', bg: '#EEEDFE', bar: '#7F77DD' },
  Molten:    { color: '#3B6D11', bg: '#EAF3DE', bar: '#639922' },
  Mitre:     { color: '#0F6E56', bg: '#E1F5EE', bar: '#1D9E75' },
  Reusch:    { color: '#993C1D', bg: '#FAECE7', bar: '#D85A30' },
  Falabella: { color: '#854F0B', bg: '#FAEEDA', bar: '#EF9F27' },
  Meli:      { color: '#185FA5', bg: '#E6F1FB', bar: '#378ADD' },
  Paris:     { color: '#993556', bg: '#FBEAF0', bar: '#D4537E' },
  Ripley:    { color: '#854F0B', bg: '#FAEEDA', bar: '#BA7517' },
  Walmart:   { color: '#3B6D11', bg: '#EAF3DE', bar: '#639922' },
  Hites:     { color: '#0F6E56', bg: '#E1F5EE', bar: '#1D9E75' },
};

// ─── STATE ────────────────────────────────────────────────────────────────────
let currentView = 'dia';
let allData = [];  // raw rows from all sheets
let resumenData = []; // rows from Resumen sheet
let chartInstances = {};

// ─── PIN CONFIG ───────────────────────────────────────────────────────────────
const PIN = '4967';

// ─── PIN LOGIC ────────────────────────────────────────────────────────────────
let pinBuffer = '';

function pinKey(k) {
  if (pinBuffer.length >= 4) return;
  pinBuffer += k;
  updateDots();
  if (pinBuffer.length === 4) checkPin();
}
function pinBack() {
  pinBuffer = pinBuffer.slice(0, -1);
  updateDots();
  document.getElementById('pin-error').textContent = '';
}
function pinClear() {
  pinBuffer = '';
  updateDots();
  document.getElementById('pin-error').textContent = '';
}
function updateDots() {
  for (let i = 0; i < 4; i++) {
    const d = document.getElementById('d' + i);
    d.classList.toggle('filled', i < pinBuffer.length);
    d.classList.remove('error');
  }
  // Sync hidden input for keyboard entry
  const inp = document.getElementById('pin-hidden-input');
  if (inp) inp.value = pinBuffer;
}
function checkPin() {
  if (pinBuffer === PIN) {
    document.getElementById('pin-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadData();
  } else {
    for (let i = 0; i < 4; i++) document.getElementById('d' + i).classList.add('error');
    document.getElementById('pin-error').textContent = 'Código incorrecto';
    setTimeout(() => { pinClear(); document.getElementById('pin-error').textContent = ''; }, 1200);
  }
}

// Keyboard support
document.addEventListener('keydown', function(e) {
  const pinScreen = document.getElementById('pin-screen');
  if (!pinScreen || pinScreen.style.display === 'none') return;
  if (e.key >= '0' && e.key <= '9') { pinKey(e.key); }
  else if (e.key === 'Backspace') { pinBack(); }
  else if (e.key === 'Delete' || e.key === 'Escape') { pinClear(); }
  else if (e.key === 'Enter' && pinBuffer.length === 4) { checkPin(); }
});

// Auto-focus hidden input on mobile for virtual keyboard
document.addEventListener('DOMContentLoaded', function() {

});

// ─── DATA LOADING ─────────────────────────────────────────────────────────────
async function loadData() {
  document.getElementById('content').innerHTML = '<div class="loading-state"><div class="spinner"></div><br>Cargando datos...</div>';
  const errorBanner = document.getElementById('error-banner');
  errorBanner.style.display = 'none';

  const fetchSheet = async (sheetName) => {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status} al cargar hoja "${sheetName}"`);
    const text = await res.text();
    if (text.startsWith('<!')) throw new Error(`Hoja "${sheetName}" no existe o el archivo no es público`);
    return parseCSV(text);
  };

  const sheetNames = ['Sportway_Raw', 'Falabella_Raw', 'Meli_Raw', 'Reusch_Raw', 'Mitre_Raw', 'Molten_Raw', 'Macron_Raw', 'Resumen'];

  try {
    const results = await Promise.allSettled(sheetNames.map(s => fetchSheet(s)));

    const errors = results.map((r,i) => r.status === 'rejected' ? `${sheetNames[i]}: ${r.reason.message}` : null).filter(Boolean);
    if (errors.length > 0) {
      errorBanner.style.display = 'block';
      errorBanner.innerHTML = '⚠ Problemas al cargar: ' + errors.join(' | ');
    }

    allData = [];
    results.forEach((r, i) => {
      if (r.status === 'fulfilled' && sheetNames[i] !== 'Resumen') {
        const rows = r.value;
        if (rows.length < 2) return;
        const header = rows[0];
        rows.slice(1).forEach(row => {
          const obj = {};
          header.forEach((h, j) => obj[h.trim()] = row[j]);
          if (obj['Fecha Pedido'] && obj['Total Pedido']) allData.push(obj);
        });
      } else if (r.status === 'fulfilled' && sheetNames[i] === 'Resumen') {
        const rows = r.value;
        if (rows.length < 2) return;
        const header = rows[0];
        resumenData = rows.slice(1).map(row => {
          const obj = {};
          header.forEach((h, j) => obj[h.trim()] = row[j]);
          return obj;
        }).filter(r => r['Fecha'] && r['Total']);
      }
    });

    if (allData.length === 0 && resumenData.length === 0) {
      document.getElementById('content').innerHTML = '<div class="empty-state">Sin datos. Verifica que el Google Sheets esté compartido como público (Cualquiera con el vínculo → Lector).</div>';
      return;
    }

    document.getElementById('last-update').textContent = 'Act. ' + new Date().toLocaleTimeString('es-CL', {hour:'2-digit',minute:'2-digit'});
    renderView();
  } catch(e) {
    errorBanner.style.display = 'block';
    errorBanner.innerHTML = '⚠ Error de conexión: ' + e.message;
    document.getElementById('content').innerHTML = '<div class="empty-state">No se pudo conectar con Google Sheets.</div>';
  }
}

function parseCSV(text) {
  const rows = [];
  const lines = text.split('\n');
  lines.forEach(line => {
    if (!line.trim()) return;
    const row = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; continue; }
      if (c === ',' && !inQ) { row.push(cur.trim()); cur = ''; continue; }
      cur += c;
    }
    row.push(cur.trim());
    rows.push(row);
  });
  return rows;
}

// ─── NUMBER PARSING (handles $, commas, dots as thousands sep) ───────────────
function parseNum(val) {
  if (!val && val !== 0) return 0;
  const s = String(val).trim();
  // Remove currency symbols, spaces
  const cleaned = s.replace(/[$\s]/g, '');
  // If commas are thousands separators (e.g. "1,234,567" or "1,234") 
  // vs decimal separator (e.g. "1.234,56")
  // Strategy: remove all dots and commas that are thousands seps
  // Detect: if ends with ,XX (2 digits) treat comma as decimal — unlikely for CLP
  // For CLP (no decimals), just strip all commas and dots used as thousands
  const noThousands = cleaned.replace(/[.,]/g, '');
  const n = parseInt(noThousands, 10);
  return isNaN(n) ? 0 : n;
}

// ─── DATE PARSING ─────────────────────────────────────────────────────────────
function parseDate(val) {
  if (!val) return null;
  if (typeof val === 'string') {
    // ISO format: 2026-05-19T11:12:36.000-04:00
    if (val.includes('T')) {
      const d = new Date(val);
      return isNaN(d) ? null : d;
    }
    // Try direct parse
    const d = new Date(val);
    if (!isNaN(d)) return d;
  }
  // Excel serial number
  const n = parseFloat(val);
  if (!isNaN(n)) {
    const d = new Date((n - 25569) * 86400 * 1000);
    return d;
  }
  return null;
}

function toDateStr(d) {
  if (!d) return null;
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

// ─── FILTERING ────────────────────────────────────────────────────────────────
function getFilteredData() {
  const now = new Date();
  const todayStr = toDateStr(now);
  const curMonth = now.getMonth();
  const curYear = now.getFullYear();

  return allData.filter(row => {
    const d = parseDate(row['Fecha Pedido']);
    if (!d) return false;
    if (currentView === 'dia') return toDateStr(d) === todayStr;
    if (currentView === 'ayer' || currentView === 'dia') { const ayer = new Date(now.getTime() - 86400000); return toDateStr(d) === toDateStr(ayer); }
    if (currentView === 'mes') return d.getMonth() === curMonth && d.getFullYear() === curYear;
    if (currentView === 'anio') return d.getFullYear() === curYear;
    return true;
  });
}

// ─── AGGREGATION ─────────────────────────────────────────────────────────────
function aggregateBySite(rows) {
  const sites = {};
  rows.forEach(row => {
    const tienda = (row['Tienda'] || '').trim();
    if (!tienda) return;
    const total = parseNum(row['Total Pedido']);
    const orderId = row['Order ID'];
    if (!sites[tienda]) sites[tienda] = { amount: 0, orders: new Set() };
    sites[tienda].amount += total;
    if (orderId) sites[tienda].orders.add(orderId);
  });
  // Convert sets to counts — but since each row is a line item, count unique orders
  Object.keys(sites).forEach(k => {
    sites[k].orderCount = sites[k].orders.size || Math.round(sites[k].amount / 35000) || 1;
  });
  return sites;
}

function aggregateProducts(rows) {
  const prods = {};
  rows.forEach(row => {
    const sku = (row['SKU'] || '').trim();
    const name = (row['Producto'] || '').split(' - ')[0].trim();
    if (!sku) return;
    const qty = parseNum(row['Qty']) || 1;
    const sub = parseNum(row['Subtotal Línea']) || parseNum(row['Total Pedido']) || 0;
    const key = sku;
    if (!prods[key]) prods[key] = { sku, name, qty: 0, amount: 0 };
    prods[key].qty += qty;
    prods[key].amount += sub;
  });
  return Object.values(prods).sort((a,b) => b.qty - a.qty).slice(0, 15);
}

// ─── RESUMEN DATA AGGREGATION (for period totals) ─────────────────────────────
function getResumenTotals() {
  const now = new Date();
  const todayStr = toDateStr(now);
  const curMonth = now.getMonth();
  const curYear = now.getFullYear();

  const sites = [...TIENDAS_PROPIAS, ...MARKETPLACES];
  const totals = {};
  sites.forEach(s => totals[s] = 0);

  resumenData.forEach(row => {
    const fechaVal = row['Fecha'];
    const d = parseDate(fechaVal);
    if (!d) return;
    const dStr = toDateStr(d);
    let include = false;
    if (currentView === 'dia') include = dStr === todayStr;
    else if (currentView === 'ayer') { const ayer = new Date(now.getTime() - 86400000); include = dStr === toDateStr(ayer); }
    else if (currentView === 'mes') include = d.getMonth() === curMonth && d.getFullYear() === curYear;
    else if (currentView === 'anio') include = d.getFullYear() === curYear;
    if (!include) return;

    sites.forEach(s => {
      // Try exact match first, then case-insensitive
      let val = row[s];
      if (val === undefined) {
        const k = Object.keys(row).find(k => k.trim().toLowerCase() === s.toLowerCase());
        val = k ? row[k] : 0;
      }
      totals[s] += parseNum(val);
    });
  });
  return totals;
}

function getResumenTimeSeries() {
  const now = new Date();
  const curMonth = now.getMonth();
  const curYear = now.getFullYear();

  let filtered = resumenData;
  if (currentView === 'mes') {
    filtered = resumenData.filter(r => {
      const d = parseDate(r['Fecha']);
      return d && d.getMonth() === curMonth && d.getFullYear() === curYear;
    });
  } else if (currentView === 'anio') {
    filtered = resumenData.filter(r => {
      const d = parseDate(r['Fecha']);
      return d && d.getFullYear() === curYear;
    });
  } else if (currentView === 'ayer') {
    filtered = resumenData.filter(r => {
      const d = parseDate(r['Fecha']);
      const ayer = new Date(now.getTime() - 86400000);
      return d && toDateStr(d) === toDateStr(ayer);
    });
  } else {
    // last 14 days
    const cutoff = new Date(now.getTime() - 14 * 86400000);
    filtered = resumenData.filter(r => {
      const d = parseDate(r['Fecha']);
      return d && d >= cutoff;
    });
  }

  const getCol = (r, ...keywords) => {
    const keys = Object.keys(r);
    const k = keys.find(k => keywords.every(kw => k.toLowerCase().includes(kw.toLowerCase())));
    return k ? parseNum(r[k]) : 0;
  };
  const getTotal = r => {
    // Match exact column 'Total' — not Subtotal Mkt or Subtotal Tiendas
    const k = Object.keys(r).find(k => k.trim().toLowerCase() === 'total');
    return k ? parseNum(r[k]) : 0;
  };

  return filtered.map(r => ({
    date: parseDate(r['Fecha']),
    propias: getCol(r, 'subtotal', 'tienda'),
    mkt: getCol(r, 'subtotal', 'mkt'),
    total: getTotal(r),
  })).filter(r => r.date).sort((a,b) => a.date - b.date);
}

// ─── FORMAT HELPERS ────────────────────────────────────────────────────────────
function fmtCLP(n) {
  return '$' + Math.round(n).toLocaleString('es-CL');
}
function fmtM(n) {
  if (n >= 1000000) return '$' + (n/1000000).toFixed(1).replace('.',',') + 'M';
  if (n >= 1000) return '$' + Math.round(n/1000) + 'K';
  return '$' + Math.round(n);
}

// ─── VIEW CONTROLLER ──────────────────────────────────────────────────────────
function setView(v) {
  currentView = v;
  document.querySelectorAll('.nav-tab').forEach((el, i) => {
    el.classList.toggle('active', ['dia','ayer','mes','anio','detalle'][i] === v);
  });
  renderView();
}

function renderView() {

  const rows = getFilteredData();
  const bySite = aggregateBySite(rows);

  // Use resumen for site totals when available (more accurate)
  const resumenTotals = getResumenTotals();
  const hasResumen = Object.values(resumenTotals).some(v => v > 0);

  // Merge: prefer resumen data for amounts, use raw for orders
  const siteData = {};
  const allSites = [...TIENDAS_PROPIAS, ...MARKETPLACES];
  allSites.forEach(s => {
    const raw = bySite[s] || { amount: 0, orderCount: 0 };

      amount: hasResumen ? (resumenTotals[s] || raw.amount) : raw.amount,
      orderCount: raw.orderCount || 0,
    };
  });

  const totalPropias = TIENDAS_PROPIAS.reduce((s, k) => s + (siteData[k]?.amount||0), 0);
  const totalMkt     = MARKETPLACES.reduce((s, k) => s + (siteData[k]?.amount||0), 0);
  const totalGeneral = totalPropias + totalMkt;
  const totalPedidos = allSites.reduce((s,k) => s + (siteData[k]?.orderCount||0), 0);

  const viewLabel = { dia:'hoy', ayer:'ayer', mes:'este mes', anio:'este año' }[currentView];
  const timeSeries = getResumenTimeSeries();

  const maxSite = Math.max(...allSites.map(s => siteData[s]?.amount||0), 1);

  let html = `

    </div>
    <div class="metric-card">
      <div class="metric-label"><span class="metric-dot" style="background:var(--c-teal)"></span> Sitios propios</div>
      <div class="metric-value">${fmtM(totalPropias)}</div>
      <div class="metric-sub">${totalGeneral > 0 ? Math.round(totalPropias/totalGeneral*100) : 0}% del total</div>
    </div>
    <div class="metric-card">
      <div class="metric-label"><span class="metric-dot" style="background:var(--c-amber)"></span> Marketplaces</div>
      <div class="metric-value">${fmtM(totalMkt)}</div>
      <div class="metric-sub">${totalGeneral > 0 ? Math.round(totalMkt/totalGeneral*100) : 0}% del total</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Pedidos</div>
      <div class="metric-value">${totalPedidos || '—'}</div>
      <div class="metric-sub">${viewLabel}</div>
    </div>
  </div>`;

  // SITIOS PROPIOS
  html += `<div class="section-title">Sitios propios</div><div class="site-grid">`;
  TIENDAS_PROPIAS.forEach(s => {
    const d = siteData[s];
    const col = SITE_COLORS[s] || SITE_COLORS['Sportway'];
    const pct = maxSite > 0 ? Math.round(d.amount/maxSite*100) : 0;
    html += `
    <div class="site-card">
      <div class="site-card-header">
        <div class="site-name" style="color:${col.color}">${s}</div>
        <span class="site-badge badge-own">Propio</span>
      </div>
      <div class="site-amount">${fmtM(d.amount)}</div>
      <div class="site-orders">${d.orderCount ? d.orderCount + ' pedidos' : 'Sin pedidos'}</div>
      <div class="site-bar-wrap"><div class="site-bar" style="width:${pct}%;background:${col.bar}"></div></div>
    </div>`;
  });
  html += `</div>`;

  // MARKETPLACES
  html += `<div class="section-title">Marketplaces</div><div class="site-grid">`;
  MARKETPLACES.forEach(s => {
    const d = siteData[s];
    const col = SITE_COLORS[s] || { color: '#6b6b67', bg: '#F1EFE8', bar: '#888780' };
    const pct = maxSite > 0 ? Math.round(d.amount/maxSite*100) : 0;
    html += `
    <div class="site-card">
      <div class="site-card-header">
        <div class="site-name" style="color:${col.color}">${s}</div>
        <span class="site-badge badge-mkt">Marketplace</span>
      </div>
      <div class="site-amount">${fmtM(d.amount)}</div>
      <div class="site-orders">${d.orderCount ? d.orderCount + ' pedidos' : 'Sin pedidos'}</div>
      <div class="site-bar-wrap"><div class="site-bar" style="width:${pct}%;background:${col.bar}"></div></div>
    </div>`;
  });
  html += `</div>`;

  // CHARTS
  const isAyer = currentView === 'ayer' || currentView === 'dia';
  const chartLabel = currentView === 'mes' ? 'Días del mes' : 'Meses del año';
  const leftChartTitle = currentView === 'ayer' ? 'Desglose por sitio · Ayer' : currentView === 'dia' ? 'Desglose por sitio · Hoy' : 'Evolución de ventas · ' + chartLabel;

  <div class="chart-row">

    </div>`;

    html += `<div class="empty-state">Sin datos de productos para este período</div>`;

      const shortName = p.name.length > 55 ? p.name.slice(0,55)+'…' : p.name;
      html += `
      <div class="product-row">

// ─── CHART RENDERING ──────────────────────────────────────────────────────────
function renderCharts(timeSeries, totalPropias, totalMkt, siteData) {
  Object.values(chartInstances).forEach(c => c.destroy());
  chartInstances = {};

  const allSites = [...TIENDAS_PROPIAS, ...MARKETPLACES];
  const ctxLine = document.getElementById('chartLine');

  // ── LEFT CHART: Ayer → horizontal bar per site; otherwise time series ──────
  if (ctxLine) {
    if (currentView === 'ayer') {
      // Horizontal bar: one bar per site with data
      const sitesWithData = allSites.filter(s => siteData[s] && siteData[s].amount > 0);
      const labels  = sitesWithData.map(s => s);
      const values  = sitesWithData.map(s => siteData[s].amount);
      const colors  = sitesWithData.map(s => (SITE_COLORS[s] || {bar:'#888780'}).bar);

      chartInstances.line = new Chart(ctxLine, {
        type: 'bar',
        data: {
          labels,
          datasets: [{ data: values, backgroundColor: colors, borderRadius: 4, borderSkipped: false }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: ctx => ' ' + fmtCLP(ctx.raw) } }
          },
          scales: {
            x: { grid: { color: 'rgba(0,0,0,0.05)' }, ticks: { font: { size: 10 }, color: '#9b9b96', callback: v => fmtM(v) }, border: { display: false } },
            y: { grid: { display: false }, ticks: { font: { size: 11 }, color: '#333' } }
          }
        }
      });
    } else {
      // Time series stacked bar
      let labels, propias, mkts;
      if (currentView === 'anio') {
        const months = {};
        timeSeries.forEach(r => {
          const key = r.date.getFullYear() + '-' + String(r.date.getMonth()+1).padStart(2,'0');
          if (!months[key]) months[key] = { p: 0, m: 0 };
          months[key].p += r.propias;
          months[key].m += r.mkt;
        });
        const monthNames = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
        labels  = Object.keys(months).map(k => monthNames[parseInt(k.split('-')[1])-1]);
        propias = Object.values(months).map(v => v.p);
        mkts    = Object.values(months).map(v => v.m);
      } else {
        labels  = timeSeries.map(r => r.date.getDate() + '/' + (r.date.getMonth()+1));
        propias = timeSeries.map(r => r.propias);
        mkts    = timeSeries.map(r => r.mkt);
      }
      chartInstances.line = new Chart(ctxLine, {
        type: 'bar',
        data: {
          labels,
          datasets: [
            { label: 'Sitios propios', data: propias, backgroundColor: '#185FA5', borderRadius: 4, borderSkipped: false },
            { label: 'Marketplaces',   data: mkts,    backgroundColor: '#EF9F27', borderRadius: 4, borderSkipped: false },
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ' ' + fmtM(ctx.raw) } } },
          scales: {
            x: { stacked: true, grid: { display: false }, ticks: { font: { size: 11 }, color: '#9b9b96', maxRotation: 0, autoSkip: true, maxTicksLimit: 12 } },
            y: { stacked: true, grid: { color: 'rgba(0,0,0,0.05)' }, ticks: { font: { size: 11 }, color: '#9b9b96', callback: v => fmtM(v) }, border: { display: false } }
          }
        }
      });
    }
  }

  // ── DONUT: Distribution by site (all sites with amount > 0) ──────────────
  const ctxDona = document.getElementById('chartDona');
  if (ctxDona) {
    const sitesWithData = allSites.filter(s => siteData[s] && siteData[s].amount > 0);
    const donaLabels  = sitesWithData.map(s => s);
    const donaValues  = sitesWithData.map(s => siteData[s].amount);
    const donaColors  = sitesWithData.map(s => (SITE_COLORS[s] || {bar:'#888780'}).bar);
    const totalAll    = donaValues.reduce((a,b) => a+b, 0);

    chartInstances.dona = new Chart(ctxDona, {
      type: 'doughnut',
      data: {
        labels: donaLabels,
        datasets: [{ data: donaValues, backgroundColor: donaColors, borderWidth: 1, borderColor: '#fff', hoverOffset: 6 }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '60%',
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: {
            label: ctx => ' ' + ctx.label + ': ' + fmtM(ctx.raw) + ' (' + Math.round(ctx.raw/totalAll*100) + '%)'
          }}
        }
      }
    });

    // Custom legend below chart
    const legendEl = document.getElementById('dona-legend');
    if (legendEl) {
      legendEl.innerHTML = donaLabels.map((s, i) => {
        const pct = totalAll > 0 ? Math.round(donaValues[i]/totalAll*100) : 0;
        return '<span style="display:flex;align-items:center;gap:3px;white-space:nowrap">'
          + '<span style="width:8px;height:8px;border-radius:2px;background:' + donaColors[i] + ';flex-shrink:0"></span>'
          + '<span>' + s + ' ' + pct + '%</span>'
          + '</span>';
      }).join('');
    }
  }
}

// ─── DETALLE VIEW ─────────────────────────────────────────────────────────────
function renderDetalle() {
  Object.values(chartInstances).forEach(c => c.destroy());
  chartInstances = {};

  if (resumenData.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state">Sin datos en la hoja Resumen.</div>';
    return;
  }

  const sorted = [...resumenData].sort((a, b) => {
    const da = parseDate(a['Fecha']), db = parseDate(b['Fecha']);
    return (db || 0) - (da || 0);
  });

  const mktCols  = ['Falabella','Paris','Ripley','Meli','Walmart','Hites'];
  const tienCols = ['Sportway','Molten','Macron','Mitre','Reusch'];
  const allCols  = [...mktCols, ...tienCols, 'Subtotal Mkt', 'Subtotal Tiendas', 'Total'];

  // Build month options
  const months = {};
  sorted.forEach(r => {
    const d = parseDate(r['Fecha']);
    if (!d) return;
    const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    const label = d.toLocaleDateString('es-CL', { month: 'long', year: 'numeric' });
    months[key] = label.charAt(0).toUpperCase() + label.slice(1);
  });

  const selId = 'detalle-month-sel';
  const existing = document.getElementById(selId);
  // Default to current month
  const now = new Date();
  const curMonthKey = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  const selVal = existing ? existing.value : (months[curMonthKey] ? curMonthKey : 'all');

  const filtered = selVal === 'all' ? sorted : sorted.filter(r => {
    const d = parseDate(r['Fecha']);
    if (!d) return false;
    const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    return key === selVal;
  });

  const getVal = (r, col) => {
    const k = Object.keys(r).find(k => k.trim() === col);
    return k ? parseNum(r[k]) : 0;
  };

  // Column totals
  const totRow = {};
  allCols.forEach(c => { totRow[c] = 0; });
  filtered.forEach(r => allCols.forEach(c => { totRow[c] += getVal(r, c); }));

  const fmtCell = n => n === 0
    ? '<span style="color:var(--c-hint)">—</span>'
    : fmtCLP(n);

  const fmtSmall = n => {
    if (n === 0) return '';
    if (n >= 1000000) return '$' + (n/1000000).toFixed(1).replace('.',',') + 'M';
    if (n >= 1000) return '$' + Math.round(n/1000) + 'K';
    return '$' + n;
  };

  // Month select
  let monthOpts = '<option value="all">Todos los meses</option>';
  Object.entries(months).sort((a,b) => b[0].localeCompare(a[0])).forEach(([k,v]) => {
    monthOpts += '<option value="' + k + '" ' + (k === selVal ? 'selected' : '') + '>' + v + '</option>';
  });

  // Two header rows: row1 = labels, row2 = period totals under each site
  const thSite = col => {
    const tot = totRow[col];
    return '<th><span class="th-site-name">' + col + '</span>'
      + (tot > 0 ? '<span class="th-site-total">' + fmtSmall(tot) + '</span>' : '')
      + '</th>';
  };
  const thSubtotal = (label, col) =>
    '<th class="col-subtotal"><span class="th-site-name">' + label + '</span>'
    + '<span class="th-site-total">' + fmtSmall(totRow[col]) + '</span></th>';

  const thead = '<thead><tr>'
    + '<th>Fecha</th>'
    + mktCols.map(c => thSite(c)).join('')
    + thSubtotal('Sub Mkt', 'Subtotal Mkt')
    + tienCols.map(c => thSite(c)).join('')
    + thSubtotal('Sub Tiendas', 'Subtotal Tiendas')
    + '<th class="col-total"><span class="th-site-name">Total</span><span class="th-site-total">' + fmtSmall(totRow['Total'] || totRow['Subtotal Mkt'] + totRow['Subtotal Tiendas']) + '</span></th>'
    + '</tr></thead>';

  // Data rows
  let rows_html = '';
  filtered.forEach(r => {
    const d = parseDate(r['Fecha']);
    const dia = r['Dia'] || r['Día'] || '';
    const fechaStr = d ? (d.toLocaleDateString('es-CL', {day:'2-digit', month:'2-digit'}) + ' ' + dia.slice(0,3)) : '—';
    const subMkt  = getVal(r, 'Subtotal Mkt');
    const subTien = getVal(r, 'Subtotal Tiendas');
    const total   = getVal(r, 'Total') || subMkt + subTien;

    rows_html += '<tr>'
      + '<td>' + fechaStr + '</td>'
      + mktCols.map(c => '<td>' + fmtCell(getVal(r,c)) + '</td>').join('')
      + '<td class="col-subtotal">' + fmtCell(subMkt) + '</td>'
      + tienCols.map(c => '<td>' + fmtCell(getVal(r,c)) + '</td>').join('')
      + '<td class="col-subtotal">' + fmtCell(subTien) + '</td>'
      + '<td class="col-total">' + fmtCell(total) + '</td>'
      + '</tr>';
  });

  // Footer
  const footTotal = totRow['Total'] || totRow['Subtotal Mkt'] + totRow['Subtotal Tiendas'];
  const foot_html = '<tr>'
    + '<td>TOTAL</td>'
    + mktCols.map(c => '<td>' + fmtCLP(totRow[c]) + '</td>').join('')
    + '<td class="col-subtotal">' + fmtCLP(totRow['Subtotal Mkt']) + '</td>'
    + tienCols.map(c => '<td>' + fmtCLP(totRow[c]) + '</td>').join('')
    + '<td class="col-subtotal">' + fmtCLP(totRow['Subtotal Tiendas']) + '</td>'
    + '<td class="col-total">' + fmtCLP(footTotal) + '</td>'
    + '</tr>';

  const html = '<div class="detalle-filter">'
    + '<label>Mes:</label>'
    + '<select id="' + selId + '">' + monthOpts + '</select>'
    + '<span style="font-size:12px;color:var(--c-hint)">' + filtered.length + ' días</span>'
    + '</div>'
    + '<div class="detalle-card"><div class="detalle-scroll">'
    + '<table class="detalle-table">'
    + thead
    + '<tbody>' + rows_html + '</tbody>'
    + '<tfoot>' + foot_html + '</tfoot>'
    + '</table></div></div>';

  document.getElementById('content').innerHTML = html;
  document.getElementById(selId).onchange = renderDetalle;
}

window.addEventListener('load', loadData);
</script>
</body>
